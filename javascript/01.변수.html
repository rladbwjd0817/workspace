<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>오늘 점심 뭐 먹지?</h2>
  <div>
    <ul>
      <li>함양집 - 비빔밥, 10000원</li>
      <li>맥도날드</li>
      <li>홍콩반점</li>
      <li>밥버거</li>
      <li>돼지국밥</li>
      <li>홍대개미 - 덮밥, 월요일 휴무</li>
      <li>미니 신 1번지 - 분식</li>
      <li>이삭토스트</li>
      <li></li>
    </ul>
  </div>

  <script> 
    // 자바스크립트 자리! body 태그 밑에
    // 자바스크립트도 자바처럼 명령어 끝나면 ';' 붙임
    // 굳이 안붙여도 됨.
    console.log(10);
    console.log(10.5);
    console.log('script');
    console.log("script");
    console.log(10 + 5);
    console.log('aaa' + 'bbb');
    console.log('aaa' + 15);
    console.log(10 / 4); //정수 나눠도 실수로 나옴.
    console.log(10 % 3);

    // 변수
    let a = 10;
    let b = 'ddd';
    let c = 5.5;
    let d = [1,2,3]; //배열 : []에 감싸있으면 무조건 배열임!
    let e = [1, 5.5, 'hello']; //도라에몽 주머니~

    console.log(d);
    console.log(e);
    console.log(e[1]);

    let num = 5;
    let str = 'hello';
    num = str;
    console.log(num);

    //상수 : 한번 값이 저장되면 값 변경 안됨!
    const a1 = 10;
    console.log(a1);
  </script>
</body>
</html>
