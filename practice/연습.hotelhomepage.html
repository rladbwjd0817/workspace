<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="연습.hotelhompage.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container">
    <div class="img-div">
      <img src="호텔.jpg">
      <span>
        <i class="bi bi-heart"></i>
      </span>
    </div>
    <div class="info">
      <p style="font-weight: bold;">Green Hotel 4th floor suite room</p>
      <p>$599,999</p>
      <p style="color: gray;">with terrace & wine bar</p>
    </div>
    <hr>
    <div class="rooms">
      <div class="room-div">
        <span>
          <i class="fa-solid fa-bed"></i>
        </span>
        <span>4 Bedrooms</span>
      </div>
      <div class="room-div">
        <span>
          <i class="fa-solid fa-bath"></i>
        </span>
        <span>3 Bathrooms</span>
      </div>
    </div>
    <hr>
    <div class="agent">
      <p style="font-size: 18px;">Real Estate Agent</p>
      <div class="agent-div">
        <img src="태형.jpg">
        <div class="owner">
          <p style="font-size: 0.9rem;"> Kim Taehyung</p>
          <p style="font-size: 1.1rem; color: lightslategray;"> 052-013-0613</p>
        </div>
      <button>INQUIRE</button> 
    </div>
  </div>
</body>
</html>
