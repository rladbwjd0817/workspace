<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      width: 700px;
      margin:auto
    }

    .btn-div{
      text-align: center; /* left center light */
      margin-top: 20px;
    }

    table{
      border: 1px solid black;
      border-collapse: collapse;
      width: 100%;
    }
    
    tr{
      border: 1px solid purple;
    }

    td{
      border: 1px solid green;
    }

    .title-td{
      text-align: center;
      background-color: rgb(190, 255, 255);
    }

    .red{
      color: red;
    }

    .redd{
      color: red;
      font-style: italic;
      font-size: 75%;
      font-weight: bold;
    }
    
  </style>
</head>
<body>
  <div class="container">
  <!-- 테이블 영역 -->
  <div class="table-div">
    <table>
      <tbody>
        <tr>
          <td colspan="2" class="title-td">
            <span><span class="redd">(*필수입력)</span>회원 기본 정보</span>
          </td>
        </tr>
        <tr>
          <td>
            <span>
              <span class="red">*</span>아이디:</span>
          </td>
          <td>
            <input type="text" placeholder="4~12글자">
            <button type="button">아이디 검사</button>
          </td>
        </tr>
        <tr>
          <td>
            <span>
              <span class="red">*</span>비밀번호:</span>
          </td>
          <td>
              <input type="password">
              <span>4~12글자</span>
          </td>
        </tr>
        <tr>
          <td>
            <span>
              <span class="red">*</span>비밀번호확인:</span>
          </td>
          <td>
              <input type="password">
              <button type="button">비밀번호 확인</buttontyp>
          </td>
        <tr>
          <td>
            <span>
              <span class="red">*</span>메일주소:</span>
          </td>
          <td>
              <input type="email">
              <button type="button">메일 확인</button>
              <span>예)id@domain.com</span>
          </td>

        </tr>
        <tr>
          <td>
            <span>
              <span class="red">*</span>이름:</span>
          </td>
          <td>
              <input type="text">
          </td>
        </tr>
        <tr>
          <td>
            <span>
              <span class="red">*</span>생년월일:</span>
          </td>
          <td>
              <input type="number" style="width: 80px">년
              <input type="number" style="width: 60px">월
              <input type="number" style="width: 60px">일
          </td>
        </tr>
        <tr>
          <td colspan="2" class="title-td">
           <span>개인 신상 정보</span>
          </td>
        </tr>
        <tr>
          <td>
            <span class="red">*</span> <span>주민등록번호 :</span>
          </td>
          <td>
             <input type="text" maxlength="6" style="width: 90px"> - 
              <input type="text" maxlength="7" style="width: 90px">
              <input type="button" value="확인">
              <span> 예) 123456-1234567</span>
          </td>
        </tr>
        <tr>
          <td>
            <span>주소 :</span>
          </td>
          <td>
            <input type="text" style="width: 90px">

            <input type="checkbox">인터넷
            <input type="checkbox">여행
            <input type="checkbox">영화감상
            <input type="checkbox">음악감상
          </td>
        </tr>
        <tr>
          <td>
            <span>자기소개:</span>
          </td>
          <td>
            <input type="text" style="width: 550px">
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 버튼 영역 -->
  <div class="btn-div">
    <input type="button" value="회원 가입">
    <input type="button" value="다시 입력">

  </div>

</html>
