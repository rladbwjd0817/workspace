<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  .container{
    border: 5px solid red;
    margin: 20px;
    width: 500px;
    font-size: 2rem;
  }
  .inner1{
    border: 5px solid pink;
    width: 500px;
    padding: 0px 10px;
  }
  .inner2{
    border: 5px solid pink;
    width: 500px;
    padding: 0px 10px;
    box-sizing: border-box;
  }
  </style>
</head>
<body>
  <h2>box-sizing</h2>

  <div class="container">
    <div class="inner1">
      박스
    </div>
  </div>

  <div class="container">
    <div class="inner2">
      박스으
    </div>
  </div>
</body>
</html>
