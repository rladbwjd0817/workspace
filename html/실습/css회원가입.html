<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="css회원가입.css">
</head>
<body>
  <div class="container">
    <div class="join">
      <h3>회원가입</h3>
      <p>회원이 되어 다양한 혜택을 경험해 보세요!</p>
    </div>
    <div class="content">
      <div>
        <p>아이디<span>*</span></p>
        <input type="text" placeholder="아이디 입력(6~20자)" class="id">
        <button type="button">중복 확인</button>
      </div>

      <div>
        <p>비밀번호<span>*</span></p>
        <input type="password" placeholder="비밀번호 입력(문자, 숫자, 특수문자 포함 8~20자)">
      </div>

      <div>
        <p>아이디<span>*</span></p>
        <input type="password" placeholder="비밀번호 재입력">
      </div>

      <div>
        <p>이름<span>*</span></p>
        <input type="text" placeholder="이름을 입력해주세요">
      </div>

      <div>
        <p>주소<span>*</span></p>
        <input type="text" placeholder="주소를 입력해주세요" class="aaa">
        <input type="text" placeholder="상세주소">
      </div>

      <div>
        <p>전화번호<span>*</span></p>
        <input type="text" placeholder="휴대폰 번호 입력('-'제외 11자리 입력)">
      </div>

      <div>
        <p>이메일 주소<span>*</span></p>
        <input type="email" placeholder="이메일 주소">
        <span>@</span>
        <input type="email">
        <select>
          <option>선택</option>
          <option>naver.com</option>
          <option>hamail.net</option>
          <option>google.com</option>
        </select>
      </div>
      <div class="div">
        <p>생년월일</p>
        <select>
          <option>년도</option>
          <option>1995</option>
          <option>1996</option>
          <option>1997</option>
          <option>1998</option>
        </select>
        <select>
          <option>월</option>
          <option>8</option>
          <option>9</option>
          <option>10</option>
          <option>11</option>
        </select>
        <select>
          <option>일</option>
          <option>17</option>
          <option>18</option>
          <option>19</option>
          <option>20</option>
        </select>
      </div>
    </div>
    <div>
      <button type="button">가입완료</button>
      <button type="button" style="background-color: orange;">가입취소</button>
    </div>
  </div>
</body>
</html>
