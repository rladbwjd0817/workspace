<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .ul > li{
      background-color: beige;
    }

    /* ul 태그 자식 li 중 2번째 자식만 선택 */
    .ul > li:nth-child(2){
      color: rgb(4, 141, 204);
    }
    /* odd : 홀수, even : 짝수 */
    .ul > li:nth-child(odd){ 
      color: rgb(243, 17, 17);
    }
    .div > p:first-child{
      font-size: 20px;
    }
    .div > p:last-child{
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>특정 자식만 선택하기</h2>
  <ul class="ul">
    <li>떡볶이</li>
    <li>쌀국수</li>
    <li>밥버거</li>
    <li>치킨</li>
    <li>샤브샤브</li>
  </ul>
  <div class="div">
    <p>첫번째 p</p>
    <p>두번째 p</p>
    <p>세번째 p</p>
  </div>
</body>
</html>
