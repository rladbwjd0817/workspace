<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="reset.css">
  <style>
    .btn{
      border: none;
      color: black;
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 6%;
    }

    .primary{
      background-color: #FFCDC9; 
    }

    .error{
      background-color: #800c04; 
    }

    .large{
      width: 200px;
    }

    .small{
      width: 120px;
    }

    .btn:hover{
      cursor: pointer;
      background-color: #DDABA8 ;
    }
  </style>
</head>
<body>
  <h2>여러 클래스 사용하기</h2>

  <button type="button" class="btn primary large">버튼1</button>
  <button type="button" class="btn error small">버튼1</button>


</body>
</html>
