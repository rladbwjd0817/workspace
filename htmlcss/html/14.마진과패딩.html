<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 상하좌우 50씩 자리차지 */
    .div-1{
      border: 1px solid black;
      margin: 50px;
      padding: 50px;
    }

    /* 상하-30, 좌우-70씩 자리차지 */
     /* 마진이 겹치면 큰 값이 적용 */
    .div-2{
      border: 1px solid black;
      margin: 30px 70px;
      padding: 30px 70px;
    }

   /* 12시부터 시계 방향(위, 오른, 아래, 왼 순서) */
    .div-3{
      border: 1px solid rgb(22, 22, 22);
      margin: 10px 20px 30px 40px;
      padding: 10px 20px 30px 40px;
    }

    .div-4{
      border: 1px solid black;
      margin-top: 30px;
      margin-bottom: 50px;
      padding-top: 30px;
      padding-bottom: 50px;
    }
  </style>
</head>
<body>
  <h2>마진(margin, 바깥여백)과 패딩(padding, 안쪽여백)</h2>
  
  <div class="div-1">div-1</div>
  <div class="div-2">div-2</div>
  <div class="div-3">div-3</div>
  <div class="div-4">div-4</div>


</body>
</html>
