<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="그린컴퓨터아카데미로그인.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container">
    <div>
      <h2>그린컴퓨터 아카데미 로그인</h2>
      <hr style="color: gray;">
    </div>
    <div class="fff">
      <div class="content">
        <div class="login">
          <div class="enp-div">
            <p>Email</p>
            <div>
              <input type="email" placeholder="Input your Email">
            </div>
            <p>Password</p>
            <div>
              <input type="password" placeholder="Input your PW">
            </div>
         </div>
          <div class="chk-div">
            <input type="checkbox" checked>
            <span style="font-weight: bolder; font-size: 0.9rem;">로그인 유지</span>
          </div>
          <div class="btn-2">
            <button type="button">로그인</button>
          </div>
        </div>
        <div class="f-div">
          <div>
            <h4>그린컴퓨터 아카데미 울산점의 특징</h4>
          </div>
          <div>
            <ul>
              <li>
                <i class="bi bi-check-lg"></i>
                <span style="padding-bottom: 10px;">울산 지역 최고의 시설 및 컴퓨터</span>
              </li>
              <li>
                <i class="bi bi-check-lg"></i>
                <span>삼산에 위치해 교통이 편리</span>
              </li>
              <li>
                <i class="bi bi-check-lg"></i>
                <span>최고의 강사진과 취업관리</span>
              </li>
            </ul>
          </div>
          <div class="btn-div">
            <button type="button" style="border: none;border-radius: 5px;">그린컴퓨터아카데미 상세보기</button>
          </div>
          <div class="call">
            <div style="margin: auto;">
              <p>매일 8시간, 총 113일 수업</p>
            </div>
            <div>
              <p>문의전화 : 052.111.2222</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
