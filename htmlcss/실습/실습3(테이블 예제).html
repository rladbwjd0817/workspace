<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  
</head>
<body>
  <table border="1">
<tr>
  <td colspan="2"> 
    <i>(*필수입력)</i>
    회원기본정보</td>
</tr>
<tr>
  <td>*아이디:</td>
  <td>
    <input type="text" placeholder="4~12자의 영문 대소문자, 숫자만 입력하세요.">
    <input type="button" value="아이디 검사">
  </td>
</tr>
<tr>
  <td>*비밀번호:</td>
  <td>
    <input type="password"> 4~12자의 영문 대소문자와 숫자로만 입력
  </td>
</tr>
<tr>
  <td>*비밀번호확인:</td>
  <td>
    <input type="password">
    <input type="button" value="비밀번호 확인">
  </td>
</tr>
<tr>
  <td>*메일주소:</td>
  <td>
    <input type="email">
    <input type="button" value="메일 확인"> 예) id@domain.com
  </td>
</tr>
<tr>
  <td>*이름:</td>
  <td><input type="text">
  </td>
</tr>
<tr>
  <td colspan="2">개인신상정보</td>
</tr>
<tr>
  <td>*주민등록번호:</td>
  <td>
    <input type="number" maxlength="6" style="width: 80px">
    - <input type="number" maxlength="7" style="width: 80px">
    <input type="button" value="확인"> 예)123456-1234567
  </td>
</tr>
<tr>
  <td>생일:</td>
  <td>
    <input type="number" style="width: 80px">년
    <input type="number" style="width: 50px">월
    <input type="number" style="width: 50px">일
  </td>
</tr>
<tr>
  <td rowspan="2">주소:</td>
  <td><input type="number" style="width: 60px">
  <input type="button" value="우편번호 찾기">
  </td>
</tr>
<tr>
  <td><input type="text" style="width: 200px">
  <input type="text" style="width: 200px">
</td>
</tr>
<tr>
  <td>관심분야:</td>
  <td>
    <input type="checkbox">컴퓨터
    <input type="checkbox">인터넷
    <input type="checkbox">여행
    <input type="checkbox">영화감상
    <input type="checkbox">음악감상
  </td>
</tr>
<tr>
  <td>자기소개:</td>
  <td>
    <input type="text" style="width: 500px">
  </td>
</tr>
  </table>
</body>
</html>
